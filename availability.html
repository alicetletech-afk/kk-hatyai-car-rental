<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็ครถว่าง | กอกอล์ รถเช่าหาดใหญ่</title><style>
:root{
  --ink:#172033; --muted:#667085; --blue:#2f6bff; --cyan:#72d7ff;
  --card:rgba(255,255,255,.88); --line:rgba(135,158,205,.24);
  --shadow:0 18px 46px rgba(31,77,150,.12); --green:#12b76a; --red:#f04438;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 8% 8%,rgba(114,215,255,.36),transparent 30%),
  radial-gradient(circle at 90% 0%,rgba(47,107,255,.20),transparent 35%),
  linear-gradient(180deg,#eef6ff 0%,#fff 100%);padding:18px
}
.wrap{max-width:980px;margin:auto}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:24px;margin:14px 0}
.kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(47,107,255,.10);color:#2457d6;font-weight:800;font-size:13px}
h1{font-size:38px;line-height:1.05;margin:16px 0 10px;letter-spacing:-.8px}
h2{font-size:22px;margin:0 0 14px}
p{color:var(--muted);line-height:1.6;margin:0}
.back{display:inline-block;text-decoration:none;color:#2457d6;font-weight:900;margin-bottom:12px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:1fr 1fr}}
.car{border:1px solid var(--line);border-radius:26px;padding:18px;background:linear-gradient(135deg,#fff,#f4f8ff)}
.car .image{height:150px;border-radius:22px;background:linear-gradient(135deg,#dbeafe,#fff);display:flex;align-items:center;justify-content:center;color:#2457d6;font-weight:900;margin-bottom:14px;text-align:center;padding:12px}
.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(47,107,255,.08);color:#2457d6;font-size:12px;font-weight:800;margin:4px 6px 0 0}
.item{padding:11px 0;border-top:1px solid rgba(135,158,205,.16);line-height:1.5}.item:first-child{border-top:0}
.primary-cta{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}@media(min-width:760px){.primary-cta{grid-template-columns:1.1fr .9fr}}
.cta-main,.cta-sub{text-decoration:none;border-radius:28px;padding:18px;border:1px solid rgba(47,107,255,.16);display:block}
.cta-main{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 28px rgba(47,107,255,.20)}
.cta-sub{color:var(--ink);background:linear-gradient(135deg,#fff,#f4f8ff)}
.cta-main b,.cta-sub b{display:block;font-size:20px;margin-bottom:6px}.cta-main span{color:rgba(255,255,255,.88);line-height:1.45}.cta-sub span{color:var(--muted);line-height:1.45}
.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.contact-row a{text-decoration:none;color:#2457d6;background:rgba(255,255,255,.70);border:1px solid rgba(47,107,255,.14);border-radius:999px;padding:11px 14px;font-weight:900}
label{display:block;font-weight:800;margin:14px 0 7px}
input,select,textarea{width:100%;border:1px solid rgba(135,158,205,.36);border-radius:18px;padding:14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
textarea{min-height:100px;resize:vertical}.row{display:grid;gap:12px}@media(min-width:720px){.row.two{grid-template-columns:1fr 1fr}}
.btn{width:100%;border:0;min-height:54px;margin-top:18px;cursor:pointer;border-radius:999px;padding:14px 18px;font-weight:900;font-size:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 12px 28px rgba(47,107,255,.22)}
.btn:disabled{opacity:.65;cursor:not-allowed}.note,.small{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}.statusText{margin-top:12px;font-size:14px;font-weight:800;color:#2457d6;line-height:1.5}.error{color:#d92d20}
.actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}@media(min-width:760px){.actions{grid-template-columns:repeat(3,1fr)}}
.linkbtn{display:flex;align-items:center;justify-content:center;min-height:54px;text-align:center;text-decoration:none;border-radius:22px;padding:14px;font-weight:900;line-height:1.25;color:#2457d6;background:linear-gradient(135deg,#fff,#eff6ff);border:1px solid rgba(47,107,255,.16);box-shadow:0 10px 24px rgba(31,77,150,.08)}
.linkbtn.primary{color:white;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 28px rgba(47,107,255,.22)}
.carTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.status{padding:7px 10px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap}.available{background:rgba(18,183,106,.12);color:var(--green)}.unavailable{background:rgba(240,68,56,.12);color:var(--red)}
.summary{white-space:pre-wrap;background:#f6f9ff;border:1px dashed rgba(47,107,255,.28);padding:14px;border-radius:18px;color:#344054;font-size:14px;line-height:1.5}
.footer{text-align:center;color:var(--muted);font-size:13px;margin:30px 0 10px}
</style></head>
<body>
<div class="wrap">
<a class="back" href="index.html">← กลับหน้าแรก</a>
<section class="hero"><span class="kicker">📅 Availability Check</span><h1>เช็ครถว่าง 🚗</h1><p>เลือกวันรับ-คืนรถ ระบบจะอ่านข้อมูลจาก Google Sheet แล้วแสดงรถที่ว่าง พร้อมปุ่มจองรถคันนั้น</p></section>
<section class="card">
<h2>เลือกวันที่ต้องการเช่า</h2>
<div class="row two">
<div><label>วันที่รับรถ</label><input id="startDate" type="date"></div>
<div><label>วันที่คืนรถ</label><input id="endDate" type="date"></div>
</div>
<button class="btn" onclick="checkAvailability()">🔍 ตรวจสอบคิวรถ</button>
<div class="small" id="sheetStatus">กำลังโหลดข้อมูลรถจาก Google Sheet...</div>
</section>
<section class="card" id="resultCard" style="display:none"><h2>ผลการเช็ค</h2><div class="grid" id="results"></div></section>
</div>
<script>

const SHEET_ID = "1Z6M8UH2wnzGYFUcKE-zpQFSGEV-FaAp8aOWr2FAyzQ4";
const CARS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Cars`;
const AVAILABILITY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Availability`;

function parseCSV(text){
  const rows=[]; let row=[], cell="", quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"' && quote && n === '"'){ cell+='"'; i++; }
    else if(c === '"') quote=!quote;
    else if(c === "," && !quote){ row.push(cell.trim()); cell=""; }
    else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){ row.push(cell.trim()); rows.push(row); row=[]; cell=""; }
      if(c === "\r" && n === "\n") i++;
    } else cell += c;
  }
  if(cell || row.length){ row.push(cell.trim()); rows.push(row); }
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(x => x)).map(r => {
    const obj={};
    headers.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}
async function loadCars(){
  const text = await fetch(CARS_URL).then(r => r.text());
  return rowsToObjects(parseCSV(text)).filter(c => (c.Active || "TRUE").toUpperCase() !== "FALSE");
}
function carId(car){ return car["Car ID"] || car["car_id"] || ""; }
function carName(car){
  const full = car["Display Name"] || car["display_name"] || "";
  if(full) return full;
  const name = car["Car Name"] || car["car_name"] || "";
  const year = car["Year"] || car["year"] || "";
  return `${name} ${year}`.trim();
}
function carNote(car){
  return car["Description"] || car["description"] || car["Note"] || "รถเช่าหาดใหญ่ ขับง่าย ใช้งานสะดวก";
}

let cars=[]; let blockedRows=[];
async function loadAll(){
  try {
    const [carData, availText] = await Promise.all([
      loadCars(),
      fetch(AVAILABILITY_URL).then(r => r.text())
    ]);
    cars = carData;
    blockedRows = rowsToObjects(parseCSV(availText)).filter(r => (r["Car ID"] || r["car_id"]) && (r["Start Date"] || r["start_date"]) && (r["End Date"] || r["end_date"]));
    document.getElementById("sheetStatus").textContent = `โหลดข้อมูลสำเร็จ: รถ ${cars.length} คัน / รายการไม่ว่าง ${blockedRows.length} รายการ`;
  } catch(err) {
    document.getElementById("sheetStatus").textContent = "โหลด Google Sheet ไม่สำเร็จ เช็กชื่อแท็บ Cars / Availability และการแชร์ไฟล์";
  }
}
function toDate(s){ return new Date(s + "T00:00:00"); }
function overlap(start,end,bStart,bEnd){ return toDate(start) <= toDate(bEnd) && toDate(end) >= toDate(bStart); }
function checkAvailability(){
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  const results = document.getElementById("results");
  if(!start || !end){ alert("เลือกวันที่รับรถและวันที่คืนรถก่อนนะคะ"); return; }
  if(toDate(end) < toDate(start)){ alert("วันที่คืนรถต้องไม่ก่อนวันที่รับรถนะคะ"); return; }
  results.innerHTML = "";
  cars.forEach(car => {
    const id = carId(car);
    const display = carName(car);
    const blocked = blockedRows.filter(r => (r["Car ID"] || r["car_id"]) === id).some(r => overlap(start,end,(r["Start Date"] || r["start_date"]),(r["End Date"] || r["end_date"])));
    const bookingLink = `booking.html?carId=${encodeURIComponent(id)}&car=${encodeURIComponent(display)}&pickupDate=${encodeURIComponent(start)}&returnDate=${encodeURIComponent(end)}`;
    const div = document.createElement("div");
    div.className = "car";
    div.innerHTML = `<div class="carTop"><div><b>${display}</b><div class="small">${blocked ? "รถคันนี้ไม่ว่างในช่วงวันที่เลือก" : "รถคันนี้ว่างในช่วงวันที่เลือก"}</div>${blocked ? "" : `<div class="actions" style="grid-template-columns:1fr;margin-top:12px"><a class="linkbtn primary" href="${bookingLink}">จองรถคันนี้</a></div>`}</div><span class="status ${blocked ? "unavailable" : "available"}">${blocked ? "ไม่ว่าง" : "ว่าง"}</span></div>`;
    results.appendChild(div);
  });
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("resultCard").scrollIntoView({behavior:"smooth"});
}
loadAll();
</script>
</body></html>
