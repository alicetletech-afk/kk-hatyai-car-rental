<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็ครถว่าง | กอกอล์ รถเช่าหาดใหญ่</title>
<style>
:root{
  --ink:#10233A;
  --muted:#667085;
  --blue:#1D4F86;
  --blue-2:#4B9BDA;
  --yellow:#F2B544;
  --red:#D9432F;
  --red-dark:#C73624;
  --card:rgba(255,255,255,.86);
  --line:rgba(29,79,134,.16);
  --shadow:0 18px 46px rgba(16,35,58,.10);
  --green:#12B76A;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 0%,rgba(29,79,134,.10),transparent 32%),
    radial-gradient(circle at 92% 0%,rgba(75,155,218,.10),transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#f7f9fc 54%,#ffffff 100%);
  padding:18px;
}
.wrap{max-width:880px;margin:auto}
.hero,.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(248,251,255,.82));
  border:1px solid var(--line);
  border-radius:34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:24px;
  margin:14px 0;
}
.hero::after,.card::after,.car::after,.btn::after,.linkbtn::after{
  content:"";
  position:absolute;
  top:-90px;
  left:-130px;
  width:96px;
  height:280px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.46),transparent);
  transform:rotate(24deg);
  transition:.55s ease;
  pointer-events:none;
}
.hero:hover::after,.card:hover::after,.car:hover::after,.btn:hover::after,.linkbtn:hover::after{
  left:112%;
}
.hero{
  background:
    radial-gradient(circle at 100% 0%,rgba(75,155,218,.13),transparent 32%),
    linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,249,253,.88));
}
.kicker{
  display:inline-flex;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(29,79,134,.09);
  color:var(--blue);
  border:1px solid rgba(29,79,134,.12);
  font-weight:800;
  font-size:13px;
}
h1{font-size:34px;line-height:1.05;margin:16px 0 10px;letter-spacing:-.8px;color:var(--ink)}
h2{font-size:21px;margin:0 0 14px;color:var(--ink)}
p{color:var(--muted);line-height:1.6;margin:0}
.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:var(--blue);
  font-weight:900;
  margin-bottom:12px;
  padding:10px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.66);
  border:1px solid rgba(29,79,134,.12);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:.25s ease;
}
.back:hover{
  transform:translateY(-2px);
  border-color:rgba(242,181,68,.65);
  box-shadow:0 14px 28px rgba(16,35,58,.10);
}
label{display:block;font-weight:800;margin:14px 0 7px;color:var(--ink)}
input{
  width:100%;
  border:1px solid rgba(29,79,134,.18);
  border-radius:18px;
  padding:14px;
  font-size:16px;
  font-family:inherit;
  background:rgba(255,255,255,.82);
  color:var(--ink);
  outline:none;
  box-shadow:0 8px 20px rgba(16,35,58,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input:focus{
  border-color:rgba(75,155,218,.68);
  background:#fff;
  box-shadow:0 0 0 4px rgba(75,155,218,.10),0 12px 24px rgba(16,35,58,.07);
}
.row{display:grid;gap:12px}
@media(min-width:720px){.row.two{grid-template-columns:1fr 1fr}}
.btn{
  position:relative;
  overflow:hidden;
  width:100%;
  border:0;
  min-height:56px;
  margin-top:18px;
  cursor:pointer;
  border-radius:999px;
  padding:14px 18px;
  font-weight:900;
  font-size:16px;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;
  box-shadow:0 16px 34px rgba(29,79,134,.22);
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.btn:hover{
  transform:translateY(-3px);
  background:linear-gradient(135deg,#153A66,#3D8DCE);
  box-shadow:0 22px 46px rgba(29,79,134,.28);
}
.grid{display:grid;gap:12px}
.car{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.76);
  border:1px solid rgba(29,79,134,.14);
  border-radius:24px;
  padding:16px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 28px rgba(16,35,58,.07);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.car:hover{
  transform:translateY(-3px);
  border-color:rgba(242,181,68,.65);
  box-shadow:0 18px 40px rgba(16,35,58,.12);
}
.carTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.status{
  padding:7px 10px;
  border-radius:999px;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
  border:1px solid transparent;
}
.available{
  background:rgba(18,183,106,.12);
  color:#067647;
  border-color:rgba(18,183,106,.18);
}
.unavailable{
  background:rgba(217,67,47,.10);
  color:var(--red);
  border-color:rgba(217,67,47,.18);
}
.small{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.linkbtn{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:54px;
  text-align:center;
  text-decoration:none;
  border-radius:22px;
  padding:14px;
  font-weight:900;
  line-height:1.25;
  color:var(--blue);
  background:rgba(255,255,255,.76);
  border:1px solid rgba(29,79,134,.16);
  box-shadow:0 10px 24px rgba(16,35,58,.08);
  transition:.25s ease;
}
.linkbtn:hover{
  transform:translateY(-2px);
  border-color:rgba(242,181,68,.65);
  box-shadow:0 16px 34px rgba(16,35,58,.13);
}
.linkbtn.primary{
  color:#fff;
  background:linear-gradient(135deg,var(--red),#F05B42);
  box-shadow:0 14px 30px rgba(217,67,47,.22);
  border-color:rgba(217,67,47,.28);
}
.linkbtn.primary:hover{
  background:linear-gradient(135deg,var(--red-dark),#EA5036);
  box-shadow:0 20px 42px rgba(217,67,47,.28);
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← กลับหน้าแรก</a>

  <section class="hero">
    <span class="kicker">📅 Availability Check</span>
    <h1>เช็ครถว่าง 🚗</h1>
    <p>เลือกวันรับและวันคืนรถ ระบบจะตรวจสอบคิวรถและแสดงรถที่พร้อมให้บริการในช่วงวันที่คุณเลือก</p>
  </section>

  <section class="card">
    <h2>เลือกวันที่ต้องการเช่า</h2>
    <div class="row two">
      <div>
        <label>วันที่รับรถ</label>
        <input id="startDate" type="date">
      </div>
      <div>
        <label>วันที่คืนรถ</label>
        <input id="endDate" type="date">
      </div>
    </div>
    <button class="btn" onclick="checkAvailability()">🔍 ตรวจสอบคิวรถ</button>
    <div class="small" id="sheetStatus">กำลังโหลดข้อมูลจาก Google Sheet...</div>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <h2>ผลการเช็ค</h2>
    <div class="grid" id="results"></div>
  </section>
</div>

<script>
const SHEET_ID = "1Z6M8UH2wnzGYFUcKE-zpQFSGEV-FaAp8aOWr2FAyzQ4";
const CARS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Cars`;
const AVAILABILITY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Availability`;
const BOOKING_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Booking`;

let cars = [];
let manualBlocks = [];
let bookings = [];

function parseCSV(text){
  const rows = [];
  let row = [], cell = "", quote = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(c === '"' && quote && n === '"'){ cell += '"'; i++; }
    else if(c === '"') quote = !quote;
    else if(c === "," && !quote){ row.push(cell.trim()); cell = ""; }
    else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){ row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
      if(c === "\r" && n === "\n") i++;
    } else cell += c;
  }
  if(cell || row.length){ row.push(cell.trim()); rows.push(row); }
  return rows;
}

function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(x => x)).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}

function get(row, names){
  for(const name of names){
    if(row[name] !== undefined && row[name] !== "") return row[name];
  }
  return "";
}

function carId(car){
  return get(car, ["Car ID","car_id","CarID"]);
}

function carName(car){
  const display = get(car, ["Display Name","display_name"]);
  if(display) return display;
  const name = get(car, ["Car Name","car_name"]);
  const year = get(car, ["Year","year"]);
  return `${name} ${year}`.trim();
}

function carNote(car){
  return get(car, ["Description","description","Note","note"]) || "รถเช่าหาดใหญ่ ขับง่าย ใช้งานสะดวก";
}

async function loadAll(){
  try{
    const [carsText, availabilityText, bookingText] = await Promise.all([
      fetch(CARS_URL).then(r => r.text()),
      fetch(AVAILABILITY_URL).then(r => r.text()),
      fetch(BOOKING_URL).then(r => r.text())
    ]);

    cars = rowsToObjects(parseCSV(carsText)).filter(c => (get(c, ["Active","active"]) || "TRUE").toUpperCase() !== "FALSE");
    manualBlocks = rowsToObjects(parseCSV(availabilityText));
    bookings = rowsToObjects(parseCSV(bookingText));

    document.getElementById("sheetStatus").style.display = "none";
  }catch(err){
    console.error(err);
    document.getElementById("sheetStatus").style.display = "none";
    console.error("โหลด Google Sheet ไม่สำเร็จ");
  }
}

function toDate(s){
  return new Date(s + "T00:00:00");
}

function overlap(start, end, bStart, bEnd){
  if(!bStart || !bEnd) return false;
  return toDate(start) <= toDate(bEnd) && toDate(end) >= toDate(bStart);
}

function statusCountsAsBlocked(status){
  const s = (status || "").toLowerCase();
  return !["cancelled","canceled","ยกเลิก"].includes(s);
}

function isCarBlocked(car, start, end){
  const id = carId(car);
  const display = carName(car);

  const manualBlocked = manualBlocks.some(row => {
    const rowCar = get(row, ["Car ID","car_id","Car","car"]);
    const startDate = get(row, ["Start Date","start_date","Pickup Date","pickupDate"]);
    const endDate = get(row, ["End Date","end_date","Return Date","returnDate"]);
    const status = get(row, ["Status","status"]);
    const sameCar = rowCar === id || rowCar === display;
    return sameCar && statusCountsAsBlocked(status) && overlap(start, end, startDate, endDate);
  });

  const bookingBlocked = bookings.some(row => {
    const rowCar = get(row, ["Car ID","car_id","Car","car","รุ่นรถ"]);
    const startDate = get(row, ["Pickup Date","pickupDate","Start Date","start_date","วันที่รับรถ"]);
    const endDate = get(row, ["Return Date","returnDate","End Date","end_date","วันที่คืนรถ"]);
    const status = get(row, ["Status","status"]);
    const sameCar = rowCar === id || rowCar === display;
    return sameCar && statusCountsAsBlocked(status) && overlap(start, end, startDate, endDate);
  });

  return manualBlocked || bookingBlocked;
}

function checkAvailability(){
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  const results = document.getElementById("results");

  if(!start || !end){
    alert("เลือกวันที่รับรถและวันที่คืนรถก่อนนะคะ");
    return;
  }
  if(toDate(end) < toDate(start)){
    alert("วันที่คืนรถต้องไม่ก่อนวันที่รับรถนะคะ");
    return;
  }

  results.innerHTML = "";

  cars.forEach(car => {
    const display = carName(car);
    const id = carId(car);
    const blocked = isCarBlocked(car, start, end);

    const bookingLink = `booking.html?carId=${encodeURIComponent(id)}&car=${encodeURIComponent(display)}&pickupDate=${encodeURIComponent(start)}&returnDate=${encodeURIComponent(end)}`;

    const div = document.createElement("div");
    div.className = "car";
    div.innerHTML = `
      <div class="carTop">
        <div>
          <b>${display}</b>
          <div class="small">${carNote(car)}</div>
          <div class="small">${blocked ? "รถคันนี้ไม่ว่างในช่วงวันที่เลือก" : "รถคันนี้ว่างในช่วงวันที่เลือก"}</div>
          ${blocked ? "" : `<div class="actions"><a class="linkbtn primary" href="${bookingLink}">จองรถคันนี้</a></div>`}
        </div>
        <span class="status ${blocked ? "unavailable" : "available"}">${blocked ? "ไม่ว่าง" : "ว่าง"}</span>
      </div>
    `;
    results.appendChild(div);
  });

  document.getElementById("resultCard").style.display = "block";
  document.getElementById("resultCard").scrollIntoView({behavior:"smooth"});
}

loadAll();
</script>
</body>
</html>
