<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เพิ่มการจอง | K&K รถเช่าหาดใหญ่</title>
<style>
:root{
  --ink:#10233A;
  --muted:#667085;
  --blue:#1D4F86;
  --blue-2:#4B9BDA;
  --yellow:#F2B544;
  --red:#D9432F;
  --red-dark:#C73624;
  --card:rgba(255,255,255,.86);
  --line:rgba(29,79,134,.16);
  --shadow:0 18px 46px rgba(16,35,58,.10);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 0%,rgba(29,79,134,.10),transparent 32%),
    radial-gradient(circle at 92% 0%,rgba(75,155,218,.10),transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#f7f9fc 54%,#ffffff 100%);
  padding:18px;
}
.wrap{max-width:880px;margin:auto}
.hero,.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.90),rgba(248,251,255,.82));
  border:1px solid var(--line);
  border-radius:34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:24px;
  margin:14px 0;
}
.hero::after,.card::after,.btn::after{
  content:"";
  position:absolute;
  top:-90px;
  left:-130px;
  width:96px;
  height:280px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);
  transform:rotate(24deg);
  transition:.55s ease;
  pointer-events:none;
}
.hero:hover::after,.card:hover::after,.btn:hover::after{left:112%}
.back{
  display:inline-flex;
  text-decoration:none;
  color:var(--blue);
  font-weight:900;
  margin-bottom:12px;
  padding:10px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.66);
  border:1px solid rgba(29,79,134,.12);
  transition:.25s ease;
}
.back:hover{
  transform:translateY(-2px);
  border-color:rgba(242,181,68,.70);
  box-shadow:0 12px 24px rgba(16,35,58,.10);
}
.kicker{
  display:inline-flex;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(29,79,134,.09);
  color:var(--blue);
  border:1px solid rgba(29,79,134,.12);
  font-weight:900;
  font-size:13px;
}
h1{font-size:36px;line-height:1.05;margin:16px 0 10px;letter-spacing:-.8px}
h2{font-size:22px;margin:0 0 14px}
p{color:var(--muted);line-height:1.6;margin:0}
label{display:block;font-weight:850;margin:14px 0 7px;color:var(--ink)}
input,select,textarea{
  width:100%;
  border:1px solid rgba(29,79,134,.18);
  border-radius:18px;
  padding:14px;
  font-size:16px;
  font-family:inherit;
  background:rgba(255,255,255,.82);
  color:var(--ink);
  outline:none;
  box-shadow:0 8px 20px rgba(16,35,58,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(242,181,68,.68);
  background:#fff;
  box-shadow:0 0 0 4px rgba(242,181,68,.10),0 12px 24px rgba(16,35,58,.07);
}
textarea{min-height:92px;resize:vertical}
.row{display:grid;gap:12px}
@media(min-width:720px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}}
.btn{
  position:relative;
  overflow:hidden;
  width:100%;
  border:0;
  min-height:56px;
  margin-top:18px;
  cursor:pointer;
  border-radius:999px;
  padding:14px 18px;
  font-weight:900;
  font-size:16px;
  background:linear-gradient(135deg,var(--red),#F05B42);
  color:#fff;
  box-shadow:0 16px 34px rgba(217,67,47,.24);
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.btn:hover{
  transform:translateY(-3px);
  background:linear-gradient(135deg,var(--red-dark),#EA5036);
  box-shadow:0 22px 46px rgba(217,67,47,.30);
}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.note,.small{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
.statusText{margin-top:12px;font-size:14px;font-weight:900;color:var(--blue);line-height:1.5}
.error{color:var(--red)}
.price-box{
  margin-top:10px;
  padding:13px 14px;
  border-radius:18px;
  background:rgba(242,181,68,.14);
  color:var(--ink);
  border:1px solid rgba(242,181,68,.28);
  font-size:14px;
  font-weight:900;
  display:none;
}
.success{
  padding:14px;
  border-radius:20px;
  background:#ecfdf3;
  color:#067647;
  font-weight:900;
  margin-top:12px;
  display:none;
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="admin.html">← กลับหน้า Admin</a>

  <section class="hero">
    <span class="kicker">Admin Booking</span>
    <h1>เพิ่มการจองเอง</h1>
    <p>สำหรับรายการที่รับจากโทรศัพท์ / LINE / หน้าร้าน ระบบจะบันทึกเข้า Google Sheet แท็บ Booking เดียวกับฟอร์มลูกค้า</p>
  </section>

  <section class="card">
    <h2>ข้อมูลการจอง</h2>

    <form id="adminBookingForm">
      <label>ชื่อ-นามสกุล</label>
      <input id="customerName" required placeholder="เช่น คุณลูกค้า">

      <div class="row two">
        <div>
          <label>เบอร์โทร</label>
          <input id="phone" required inputmode="tel" placeholder="08x-xxx-xxxx">
        </div>
        <div>
          <label>LINE ID</label>
          <input id="lineid" placeholder="ถ้ามี">
        </div>
      </div>

      <div class="row two">
        <div>
          <label>รุ่นรถ</label>
          <select id="car" required>
            <option value="">กำลังโหลดรายชื่อรถ...</option>
          </select>
          <div class="price-box" id="priceBox"></div>
        </div>
        <div>
          <label>สถานะ</label>
          <select id="status" required>
            <option>รอคอนเฟิร์ม</option>
            <option selected>ยืนยันแล้ว</option>
            <option>รับรถแล้ว</option>
            <option>คืนรถแล้ว</option>
            <option>ยกเลิก</option>
          </select>
        </div>
      </div>

      <div class="row two">
        <div>
          <label>วันที่รับรถ</label>
          <input id="pickupDate" type="date" required>
        </div>
        <div>
          <label>วันที่คืนรถ</label>
          <input id="returnDate" type="date" required>
        </div>
      </div>

      <div class="row two">
        <div>
          <label>เวลารับรถ</label>
          <input id="pickupTime" type="time">
        </div>
        <div>
          <label>เวลาคืนรถ</label>
          <input id="returnTime" type="time">
        </div>
      </div>

      <div class="row two">
        <div>
          <label>สถานที่รับรถ</label>
          <input id="location" required placeholder="สนามบิน / ตัวเมือง / โรงแรม">
        </div>
        <div>
          <label>ราคา</label>
          <input id="price" placeholder="เช่น 2500">
        </div>
      </div>

      <label>หมายเหตุ</label>
      <textarea id="note" placeholder="เช่น รับที่สนามบิน ไฟลท์บิน หรือรายละเอียดอื่น ๆ"></textarea>

      <button class="btn" id="submitBtn" type="submit">💾 บันทึกการจอง</button>
      <div class="note">ข้อมูลจะถูกบันทึกเข้า Google Sheet และแสดงในหน้า Admin / เช็ครถว่างอัตโนมัติ</div>
      <div class="statusText" id="statusText"></div>
      <div class="success" id="successBox">เพิ่มการจองเรียบร้อยแล้ว</div>
    </form>
  </section>
</div>

<script>
const SHEET_ID = "1Z6M8UH2wnzGYFUcKE-zpQFSGEV-FaAp8aOWr2FAyzQ4";
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFfHl2X6bOhvLZ-YonmVTaNaB1-XbLLmqs2ZPHMPRNu0sH2VYAQgOjedkPYkALProY/exec";
const CARS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Cars`;

function el(id){ return document.getElementById(id); }
function toDate(value){ return new Date(value + "T00:00:00"); }

function parseCSV(text){
  const rows = [];
  let row = [], cell = "", quote = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(c === '"' && quote && n === '"'){ cell += '"'; i++; }
    else if(c === '"') quote = !quote;
    else if(c === "," && !quote){ row.push(cell.trim()); cell = ""; }
    else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){ row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
      if(c === "\r" && n === "\n") i++;
    } else cell += c;
  }
  if(cell || row.length){ row.push(cell.trim()); rows.push(row); }
  return rows;
}

function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(x => x)).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}

function get(row, names){
  for(const name of names){
    if(row[name] !== undefined && row[name] !== "") return row[name];
  }
  return "";
}

function carName(car){
  const display = get(car, ["Display Name","display_name"]);
  if(display) return display;
  const name = get(car, ["Car Name","car_name"]);
  const year = get(car, ["Year","year"]);
  return `${name} ${year}`.trim();
}

function carPrice(car){
  const priceText = get(car, ["Price Text","price_text","ราคา"]);
  if(priceText) return priceText;
  const price = get(car, ["Price","price","Daily Price","daily_price","ราคา/วัน"]);
  if(!price) return "";
  const clean = String(price).replace(/,/g, "");
  const number = Number(clean);
  if(!isNaN(number)) return `เริ่มต้น ${number.toLocaleString("th-TH")} บาท / วัน`;
  return price;
}

function updatePriceBox(){
  const select = el("car");
  const box = el("priceBox");
  const selected = select.options[select.selectedIndex];
  const price = selected ? selected.dataset.price : "";

  if(price){
    box.textContent = "💰 " + price;
    box.style.display = "block";
    if(!el("price").value) el("price").value = price.replace("เริ่มต้น ","").replace(" บาท / วัน","");
  }else{
    box.textContent = "";
    box.style.display = "none";
  }
}

async function loadCarsDropdown(){
  const select = el("car");
  try {
    const text = await fetch(CARS_URL).then(r => r.text());
    const cars = rowsToObjects(parseCSV(text)).filter(c => (get(c, ["Active","active"]) || "TRUE").toUpperCase() !== "FALSE");

    select.innerHTML = '<option value="">เลือกรุ่นรถ</option>';
    cars.forEach(car => {
      const opt = new Option(carName(car), carName(car));
      opt.dataset.price = carPrice(car);
      select.add(opt);
    });
    select.add(new Option("ยังไม่แน่ใจ ให้ช่วยแนะนำ", "ยังไม่แน่ใจ ให้ช่วยแนะนำ"));

    updatePriceBox();
  } catch(err) {
    select.innerHTML = `
      <option value="">เลือกรุ่นรถ</option>
      <option>Yaris Ativ 2017</option>
      <option>Yaris Ativ 2019</option>
      <option>Yaris Ativ 2021</option>
      <option>Yaris Ativ 2022</option>
      <option>Yaris All New 2025</option>
    `;
  }
}

function setupDateRules(){
  const today = new Date().toISOString().split("T")[0];
  el("pickupDate").min = today;
  el("returnDate").min = today;
  el("pickupDate").value = today;
  el("returnDate").value = today;

  el("pickupDate").addEventListener("change", function(){
    el("returnDate").min = this.value || today;
    if(el("returnDate").value && toDate(el("returnDate").value) < toDate(this.value)){
      el("returnDate").value = this.value;
    }
  });
}

function validateDates(){
  const pickupDate = el("pickupDate").value;
  const returnDate = el("returnDate").value;
  if(!pickupDate || !returnDate) return false;
  if(toDate(returnDate) < toDate(pickupDate)){
    alert("วันที่คืนรถต้องไม่ก่อนวันที่รับรถนะคะ");
    return false;
  }
  return true;
}

window.addEventListener("DOMContentLoaded", () => {
  setupDateRules();
  loadCarsDropdown();
  el("car").addEventListener("change", updatePriceBox);
});

el("adminBookingForm").addEventListener("submit", async function(event){
  event.preventDefault();
  if(!validateDates()) return;

  const data = {
    name: el("customerName").value.trim(),
    phone: el("phone").value.trim(),
    lineid: el("lineid").value.trim(),
    car: el("car").value,
    pickupDate: el("pickupDate").value,
    returnDate: el("returnDate").value,
    pickupTime: el("pickupTime").value,
    returnTime: el("returnTime").value,
    location: el("location").value.trim(),
    price: el("price").value.trim(),
    status: el("status").value,
    note: el("note").value.trim()
  };

  const btn = el("submitBtn");
  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";
  el("statusText").classList.remove("error");
  el("statusText").textContent = "กำลังส่งข้อมูลเข้า Google Sheet...";
  el("successBox").style.display = "none";

  const formData = new URLSearchParams();
  Object.keys(data).forEach(key => formData.append(key, data[key]));

  try{
    await fetch(WEB_APP_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:formData.toString()
    });

    el("successBox").style.display = "block";
    el("statusText").textContent = "บันทึกสำเร็จ สามารถกลับไปดูที่หน้า Admin ได้เลย";
    this.reset();
    setupDateRules();
    updatePriceBox();
    btn.disabled = false;
    btn.textContent = "💾 บันทึกการจอง";
  }catch(err){
    console.error(err);
    el("statusText").classList.add("error");
    el("statusText").textContent = "บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง";
    btn.disabled = false;
    btn.textContent = "💾 บันทึกการจอง";
  }
});
</script>
</body>
</html>
