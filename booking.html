<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>จองรถเช่า | กอกอล์ รถเช่าหาดใหญ่</title><style>
:root{
  --ink:#172033; --muted:#667085; --blue:#2f6bff; --cyan:#72d7ff;
  --card:rgba(255,255,255,.88); --line:rgba(135,158,205,.24);
  --shadow:0 18px 46px rgba(31,77,150,.12); --green:#12b76a; --red:#f04438;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 8% 8%,rgba(114,215,255,.36),transparent 30%),
  radial-gradient(circle at 90% 0%,rgba(47,107,255,.20),transparent 35%),
  linear-gradient(180deg,#eef6ff 0%,#fff 100%);padding:18px
}
.wrap{max-width:980px;margin:auto}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:24px;margin:14px 0}
.kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(47,107,255,.10);color:#2457d6;font-weight:800;font-size:13px}
h1{font-size:38px;line-height:1.05;margin:16px 0 10px;letter-spacing:-.8px}
h2{font-size:22px;margin:0 0 14px}
p{color:var(--muted);line-height:1.6;margin:0}
.back{display:inline-block;text-decoration:none;color:#2457d6;font-weight:900;margin-bottom:12px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:1fr 1fr}}
.car{border:1px solid var(--line);border-radius:26px;padding:18px;background:linear-gradient(135deg,#fff,#f4f8ff)}
.car .image{height:150px;border-radius:22px;background:linear-gradient(135deg,#dbeafe,#fff);display:flex;align-items:center;justify-content:center;color:#2457d6;font-weight:900;margin-bottom:14px;text-align:center;padding:12px}
.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(47,107,255,.08);color:#2457d6;font-size:12px;font-weight:800;margin:4px 6px 0 0}
.item{padding:11px 0;border-top:1px solid rgba(135,158,205,.16);line-height:1.5}.item:first-child{border-top:0}
.primary-cta{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}@media(min-width:760px){.primary-cta{grid-template-columns:1.1fr .9fr}}
.cta-main,.cta-sub{text-decoration:none;border-radius:28px;padding:18px;border:1px solid rgba(47,107,255,.16);display:block}
.cta-main{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 28px rgba(47,107,255,.20)}
.cta-sub{color:var(--ink);background:linear-gradient(135deg,#fff,#f4f8ff)}
.cta-main b,.cta-sub b{display:block;font-size:20px;margin-bottom:6px}.cta-main span{color:rgba(255,255,255,.88);line-height:1.45}.cta-sub span{color:var(--muted);line-height:1.45}
.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.contact-row a{text-decoration:none;color:#2457d6;background:rgba(255,255,255,.70);border:1px solid rgba(47,107,255,.14);border-radius:999px;padding:11px 14px;font-weight:900}
label{display:block;font-weight:800;margin:14px 0 7px}
input,select,textarea{width:100%;border:1px solid rgba(135,158,205,.36);border-radius:18px;padding:14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
textarea{min-height:100px;resize:vertical}.row{display:grid;gap:12px}@media(min-width:720px){.row.two{grid-template-columns:1fr 1fr}}
.btn{width:100%;border:0;min-height:54px;margin-top:18px;cursor:pointer;border-radius:999px;padding:14px 18px;font-weight:900;font-size:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 12px 28px rgba(47,107,255,.22)}
.btn:disabled{opacity:.65;cursor:not-allowed}.note,.small{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}.statusText{margin-top:12px;font-size:14px;font-weight:800;color:#2457d6;line-height:1.5}.error{color:#d92d20}
.actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}@media(min-width:760px){.actions{grid-template-columns:repeat(3,1fr)}}
.linkbtn{display:flex;align-items:center;justify-content:center;min-height:54px;text-align:center;text-decoration:none;border-radius:22px;padding:14px;font-weight:900;line-height:1.25;color:#2457d6;background:linear-gradient(135deg,#fff,#eff6ff);border:1px solid rgba(47,107,255,.16);box-shadow:0 10px 24px rgba(31,77,150,.08)}
.linkbtn.primary{color:white;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 28px rgba(47,107,255,.22)}
.carTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.status{padding:7px 10px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap}.available{background:rgba(18,183,106,.12);color:var(--green)}.unavailable{background:rgba(240,68,56,.12);color:var(--red)}
.summary{white-space:pre-wrap;background:#f6f9ff;border:1px dashed rgba(47,107,255,.28);padding:14px;border-radius:18px;color:#344054;font-size:14px;line-height:1.5}
.footer{text-align:center;color:var(--muted);font-size:13px;margin:30px 0 10px}
</style></head>
<body>
<div class="wrap">
<a class="back" href="index.html">← กลับหน้าแรก</a>
<section class="hero"><span class="kicker">📝 Booking Request</span><h1>จองรถเช่าหาดใหญ่ 🩵</h1><p>กรอกข้อมูลเพื่อส่งคำขอจองรถ ทีมงานจะตรวจสอบคิวรถและติดต่อกลับเพื่อยืนยันอีกครั้ง</p></section>
<section class="card">
<h2>ข้อมูลการจอง</h2>
<form id="bookingForm">
<label>ชื่อ-นามสกุล</label><input id="customerName" required placeholder="เช่น คุณกอกอล์">
<div class="row two"><div><label>เบอร์โทร</label><input id="phone" required inputmode="tel" placeholder="08x-xxx-xxxx"></div><div><label>LINE ID</label><input id="lineid" placeholder="ถ้ามี"></div></div>
<div class="row two"><div><label>วันที่รับรถ</label><input id="pickupDate" type="date" required></div><div><label>วันที่คืนรถ</label><input id="returnDate" type="date" required></div></div>
<div class="row two"><div><label>เวลารับรถ</label><input id="pickupTime" type="time"></div><div><label>เวลาคืนรถ</label><input id="returnTime" type="time"></div></div>
<label>รุ่นรถที่สนใจ</label><select id="car" required><option value="">กำลังโหลดรายชื่อรถ...</option></select>
<label>สถานที่รับรถ</label><select id="location" required><option value="">เลือกสถานที่รับรถ</option><option>สนามบินหาดใหญ่</option><option>ตัวเมืองหาดใหญ่</option><option>โรงแรม / ที่พัก</option><option>อื่น ๆ</option></select>
<label>หมายเหตุเพิ่มเติม</label><textarea id="note" placeholder="เช่น ไฟลท์บิน, โรงแรม, เดินทางต่างจังหวัด ฯลฯ"></textarea>
<button class="btn" id="submitBtn" type="submit">ส่งข้อมูลการจอง</button>
<div class="note">ระบบจะบันทึกข้อมูลลง Google Sheet และเปิด LINE พร้อมข้อความสรุปการจองให้อัตโนมัติ</div>
<div class="statusText" id="statusText"></div>
</form></section>
<section class="card" id="previewCard" style="display:none"><h2>ข้อความสรุปการจอง</h2><div class="summary" id="summary"></div><div class="actions"><a class="linkbtn" id="lineManual" href="#" target="_blank">เปิด LINE เพื่อส่งข้อความ</a></div></section>
</div>
<script>

const SHEET_ID = "1Z6M8UH2wnzGYFUcKE-zpQFSGEV-FaAp8aOWr2FAyzQ4";
const CARS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Cars`;
const AVAILABILITY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Availability`;

function parseCSV(text){
  const rows=[]; let row=[], cell="", quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"' && quote && n === '"'){ cell+='"'; i++; }
    else if(c === '"') quote=!quote;
    else if(c === "," && !quote){ row.push(cell.trim()); cell=""; }
    else if((c === "\n" || c === "\r") && !quote){
      if(cell || row.length){ row.push(cell.trim()); rows.push(row); row=[]; cell=""; }
      if(c === "\r" && n === "\n") i++;
    } else cell += c;
  }
  if(cell || row.length){ row.push(cell.trim()); rows.push(row); }
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(x => x)).map(r => {
    const obj={};
    headers.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}
async function loadCars(){
  const text = await fetch(CARS_URL).then(r => r.text());
  return rowsToObjects(parseCSV(text)).filter(c => (c.Active || "TRUE").toUpperCase() !== "FALSE");
}
function carId(car){ return car["Car ID"] || car["car_id"] || ""; }
function carName(car){
  const full = car["Display Name"] || car["display_name"] || "";
  if(full) return full;
  const name = car["Car Name"] || car["car_name"] || "";
  const year = car["Year"] || car["year"] || "";
  return `${name} ${year}`.trim();
}
function carNote(car){
  return car["Description"] || car["description"] || car["Note"] || "รถเช่าหาดใหญ่ ขับง่าย ใช้งานสะดวก";
}

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFfHl2X6bOhvLZ-YonmVTaNaB1-XbLLmqs2ZPHMPRNu0sH2VYAQgOjedkPYkALProY/exec";
const params = new URLSearchParams(window.location.search);
function el(id){ return document.getElementById(id); }
function toDate(value){ return new Date(value + "T00:00:00"); }
function validateDates(showAlert = true){
  const pickupDate = el("pickupDate").value, returnDate = el("returnDate").value, status = el("statusText");
  status.classList.remove("error"); status.textContent = "";
  if(!pickupDate || !returnDate) return false;
  if(toDate(returnDate) < toDate(pickupDate)){ status.classList.add("error"); status.textContent = "วันที่คืนรถต้องไม่ก่อนวันที่รับรถนะคะ"; if(showAlert) alert("วันที่คืนรถต้องไม่ก่อนวันที่รับรถนะคะ"); return false; }
  return true;
}
async function initCarsDropdown(){
  const select = el("car");
  try {
    const cars = await loadCars();
    select.innerHTML = '<option value="">เลือกรุ่นรถ</option>';
    cars.forEach(car => {
      const opt = new Option(carName(car), carName(car));
      opt.dataset.carId = carId(car);
      select.add(opt);
    });
    select.add(new Option("ยังไม่แน่ใจ ให้ช่วยแนะนำ", "ยังไม่แน่ใจ ให้ช่วยแนะนำ"));
    const selectedCar = params.get("car");
    if(selectedCar){
      let found=false;
      [...select.options].forEach(option => { if(option.text === selectedCar || option.value === selectedCar){ option.selected = true; found=true; } });
      if(!found) select.add(new Option(selectedCar, selectedCar, true, true));
    }
  } catch(err) {
    select.innerHTML = '<option value="">เลือกรุ่นรถ</option><option>Yaris Ativ 2017</option><option>Yaris Ativ 2019</option><option>Yaris Ativ 2021</option><option>Yaris Ativ 2022</option><option>Yaris All New 2025</option><option>ยังไม่แน่ใจ ให้ช่วยแนะนำ</option>';
  }
}
window.addEventListener("DOMContentLoaded", () => {
  const selectedPickup = params.get("pickupDate"), selectedReturn = params.get("returnDate");
  if(selectedPickup) el("pickupDate").value = selectedPickup;
  if(selectedReturn) el("returnDate").value = selectedReturn;
  el("pickupDate").addEventListener("change", () => validateDates(false));
  el("returnDate").addEventListener("change", () => validateDates(false));
  initCarsDropdown();
});
el("bookingForm").addEventListener("submit", async function(event){
  event.preventDefault();
  if(!validateDates(true)) return;
  const data = {
    name: el("customerName").value.trim(), phone: el("phone").value.trim(), lineid: el("lineid").value.trim(),
    pickupDate: el("pickupDate").value, returnDate: el("returnDate").value, pickupTime: el("pickupTime").value,
    returnTime: el("returnTime").value, car: el("car").value, location: el("location").value, note: el("note").value.trim()
  };
  const message = `สวัสดีค่ะ/ครับ ต้องการส่งข้อมูลการจองรถเช่า K&K รถเช่าหาดใหญ่

ชื่อ: ${data.name}
เบอร์โทร: ${data.phone}
LINE ID: ${data.lineid || "-"}
รุ่นรถที่สนใจ: ${data.car}

วันที่รับรถ: ${data.pickupDate}
เวลารับรถ: ${data.pickupTime || "-"}
วันที่คืนรถ: ${data.returnDate}
เวลาคืนรถ: ${data.returnTime || "-"}

สถานที่รับรถ: ${data.location}
หมายเหตุ: ${data.note || "-"}

รบกวนตรวจสอบคิวรถและติดต่อกลับเพื่อยืนยันการจองค่ะ/ครับ`;
  el("summary").textContent = message;
  el("previewCard").style.display = "block";
  const lineUrl = "https://line.me/R/oaMessage/@540snozl/?" + encodeURIComponent(message);
  el("lineManual").href = lineUrl;
  const btn = el("submitBtn");
  btn.disabled = true; btn.textContent = "กำลังบันทึกข้อมูล..."; el("statusText").textContent = "กำลังส่งข้อมูลเข้า Google Sheet...";
  const formData = new URLSearchParams(); Object.keys(data).forEach(key => formData.append(key, data[key]));
  try {
    await fetch(WEB_APP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"}, body:formData.toString() });
    el("statusText").textContent = "ส่งข้อมูลแล้ว กำลังเปิด LINE...";
    setTimeout(() => { window.location.href = lineUrl; }, 700);
  } catch(error) {
    el("statusText").classList.add("error"); el("statusText").textContent = "ส่งข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง หรือกดเปิด LINE ด้านล่าง";
    btn.disabled = false; btn.textContent = "ส่งข้อมูลการจอง";
  }
});
</script>
</body></html>
